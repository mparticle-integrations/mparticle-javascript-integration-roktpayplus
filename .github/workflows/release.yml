name: Release Kit

on:
    workflow_dispatch:
        inputs:
            dryRun:
                description: 'Do a dry run to preview instead of a real release [true/false]'
                required: true
                default: 'true'

jobs:
    # Kit release is done from main branch.
    confirm-public-repo-main-branch:
        name: 'Confirm release is run from public/main branch'
        uses: mParticle/mparticle-workflows/.github/workflows/sdk-release-repo-branch-check.yml@stable

    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest
        needs: confirm-public-repo-main-branch
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - name: Run NPM CI
              run: npm ci

            - name: Build Files
              run: npm run build

            - name: Run Core tests
              run: npm run test

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    create-release-branch:
        name: Create release branch
        runs-on: ubuntu-latest
        needs:
            - build-and-test
            - confirm-public-repo-main-branch
        steps:
            - name: Checkout development branch
              uses: actions/checkout@v6
              with:
                  repository: mparticle-integrations/mparticle-javascript-integration-roktpayplus
                  ref: development

            - name: Create and push release branch
              run: |
                  git checkout -b release/${{ github.run_number }}
                  git push origin release/${{ github.run_number }}
    release:
        name: Perform Release
        runs-on: ubuntu-latest
        needs:
            - build-and-test
            - create-release-branch
            - confirm-public-repo-main-branch

        # OIDC permissions for npm trusted publishing
        permissions:
          contents: write
          issues: write
          pull-requests: write
          id-token: write # Required for OIDC authentication with npm

        env:
            GIT_AUTHOR_NAME: mparticle-automation
            GIT_AUTHOR_EMAIL: developers@mparticle.com
            GIT_COMMITTER_NAME: mparticle-automation
            GIT_COMMITTER_EMAIL: developers@mparticle.com
            # npm auth: publish authenticates via OIDC trusted publishing; the token
            # remains as a fallback (provenance is still attested via OIDC).
            NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

        steps:
            - name: Generate GitHub App token
              id: app_token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ secrets.SDK_RELEASE_GITHUB_APP_ID }}
                  private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}

            - name: Checkout public main branch
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: main
                  token: ${{ steps.app_token.outputs.token }}

            - name: Import GPG Key
              uses: crazy-max/ghaction-import-gpg@v4
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.GPG_PASSPHRASE }}
                  git_user_signingkey: true
                  git_commit_gpgsign: true

            - name: Merge release branch into main branch
              run: |
                  git pull origin release/${{ github.run_number }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Ensure npm CLI supports OIDC
              run: npm install -g npm@latest

            - name: Release --dry-run
              if: ${{ github.event.inputs.dryRun == 'true'}}
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  npx semantic-release --dry-run
            - name: Release
              if: ${{ github.event.inputs.dryRun == 'false'}}
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  npx semantic-release
            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

            - name: Push automated release commits to release branch
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: |
                  git push origin HEAD:release/${{ github.run_number }}
    sync-repository:
        name: Sync repositories
        needs: release
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Generate GitHub App token
              id: app_token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ secrets.SDK_RELEASE_GITHUB_APP_ID }}
                  private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}

            - name: Checkout main branch
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  repository: ${{ github.repository }}
                  token: ${{ steps.app_token.outputs.token }}
                  ref: main

            - name: Merge release branch into main branch
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: |
                  git pull origin release/${{ github.run_number }}
            - name: Push release commits to main and development branches
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: |
                  git push origin HEAD:development
                  git push origin HEAD:main
            - name: Delete release branch
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: |
                  git push --delete origin release/${{ github.run_number }}

            # Runs last so a Release failure can't block npm publish, the tag, or the sync.
            - name: Resolve released version
              id: version
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: echo "release-version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              if: ${{ github.event.inputs.dryRun == 'false' }}
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  makeLatest: true
                  allowUpdates: true
                  generateReleaseNotes: true
                  tag: ${{ steps.version.outputs.release-version }}
                  artifacts: 'dist/RoktPayPlus-Kit.common.js,dist/RoktPayPlus-Kit.esm.js,dist/RoktPayPlus-Kit.iife.js,dist/RoktPayPlus-Kit.d.ts'
                  token: ${{ steps.app_token.outputs.token }}
